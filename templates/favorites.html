<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>葫芦侠收藏列表</title>
    <style>
        :root {
            --primary: #5B6ABF;
            --primary-hover: #4A56A8;
            --bg: #f5f7fa;
            --card-bg: #ffffff;
            --text: #2c3e50;
            --text-dim: #7f8c8d;
            --success: #27AE60;
            --danger: #E74C3C;
            --border: #e1e8ed;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                         "Microsoft YaHei", "Helvetica Neue", sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: var(--primary);
        }

        .search-box {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .form-group {
            flex: 1;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-dim);
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 14px;
            font-size: 14px;
            border: 2px solid var(--border);
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: var(--primary);
        }

        .btn {
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 600;
            color: white;
            background: var(--primary);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .favorites-container {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-dim);
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .favorites-list {
            display: grid;
            gap: 16px;
        }

        .favorite-item {
            padding: 16px;
            border: 2px solid var(--border);
            border-radius: 10px;
            transition: all 0.2s;
            cursor: pointer;
        }

        .favorite-item:hover {
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(91, 106, 191, 0.15);
            transform: translateY(-2px);
        }

        .favorite-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .favorite-title {
            flex: 1;
            font-size: 16px;
            font-weight: 600;
            color: var(--text);
            line-height: 1.5;
            margin-right: 12px;
        }

        .favorite-actions {
            display: flex;
            gap: 8px;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            color: white;
            background: var(--primary);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-sm:hover {
            background: var(--primary-hover);
        }

        .btn-sm.copied {
            background: var(--success);
        }

        .favorite-meta {
            display: flex;
            gap: 16px;
            font-size: 13px;
            color: var(--text-dim);
            flex-wrap: wrap;
        }

        .favorite-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .post-id {
            font-family: 'Courier New', monospace;
            font-weight: 600;
            color: var(--primary);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-dim);
        }

        .empty-state .icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .error-message {
            background: #fee;
            color: var(--danger);
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--border);
        }

        .stat-item {
            font-size: 14px;
            color: var(--text-dim);
        }

        .stat-item strong {
            color: var(--primary);
            font-size: 18px;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 葫芦侠收藏列表</h1>
            <div class="search-box">
                <div class="form-group">
                    <label>用户 ID</label>
                    <input type="text" id="userId" placeholder="输入要查询的用户ID">
                </div>
                <div class="form-group" style="max-width: 150px;">
                    <label>数量</label>
                    <input type="number" id="count" value="20" min="1" max="100">
                </div>
                <button class="btn" onclick="loadFavorites()">🔍 查询收藏</button>
            </div>
        </div>

        <div class="favorites-container">
            <div id="loadingState" class="loading" style="display: none;">
                <div class="spinner"></div>
                <p style="margin-top: 16px;">加载中...</p>
            </div>

            <div id="errorState" style="display: none;"></div>

            <div id="favoritesContent">
                <div class="empty-state">
                    <div class="icon">💫</div>
                    <p>请输入用户 ID 并点击查询</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function loadFavorites() {
            const userId = document.getElementById('userId').value.trim();
            const count = parseInt(document.getElementById('count').value) || 20;

            if (!userId) {
                alert('请输入用户 ID');
                return;
            }

            // 显示加载状态
            document.getElementById('loadingState').style.display = 'block';
            document.getElementById('errorState').style.display = 'none';
            document.getElementById('favoritesContent').innerHTML = '';

            try {
                const response = await fetch(`/api/favorites?userid=${userId}&count=${count}`);
                const data = await response.json();

                document.getElementById('loadingState').style.display = 'none';

                if (data.success && data.msg && data.msg.length > 0) {
                    displayFavorites(data.msg);
                } else {
                    displayEmpty(data.msg || '该用户暂无收藏');
                }
            } catch (error) {
                document.getElementById('loadingState').style.display = 'none';
                displayError('加载失败: ' + error.message);
            }
        }

        function displayFavorites(favorites) {
            const content = document.getElementById('favoritesContent');

            // 统计信息
            const statsHtml = `
                <div class="stats">
                    <div class="stat-item">
                        共 <strong>${favorites.length}</strong> 条收藏
                    </div>
                </div>
            `;

            // 收藏列表
            const listHtml = favorites.map((item, index) => {
                const postID = item.postID || '-';
                const title = item.title || '无标题';
                const categoryName = (item.category && item.category.title) || '-';
                const createTime = item.createTime ? formatTimestamp(item.createTime) : '-';

                return `
                    <div class="favorite-item">
                        <div class="favorite-header">
                            <div class="favorite-title">${escapeHtml(title)}</div>
                            <div class="favorite-actions">
                                <button class="btn-sm" onclick="copyPostId('${postID}', this)">📋 复制ID</button>
                            </div>
                        </div>
                        <div class="favorite-meta">
                            <span>🆔 帖子ID: <span class="post-id">${escapeHtml(postID)}</span></span>
                            <span>📂 板块: ${escapeHtml(categoryName)}</span>
                            <span>🕒 时间: ${escapeHtml(createTime)}</span>
                        </div>
                    </div>
                `;
            }).join('');

            content.innerHTML = statsHtml + '<div class="favorites-list">' + listHtml + '</div>';
        }

        function displayEmpty(message) {
            const content = document.getElementById('favoritesContent');
            content.innerHTML = `
                <div class="empty-state">
                    <div class="icon">📭</div>
                    <p>${escapeHtml(message)}</p>
                </div>
            `;
        }

        function displayError(message) {
            const errorState = document.getElementById('errorState');
            errorState.innerHTML = `<div class="error-message">❌ ${escapeHtml(message)}</div>`;
            errorState.style.display = 'block';

            displayEmpty('加载失败，请重试');
        }

        function copyPostId(postId, button) {
            if (!postId || postId === '-') {
                alert('帖子ID无效');
                return;
            }

            // 使用现代 Clipboard API
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(postId).then(() => {
                    showCopySuccess(button);
                }).catch(err => {
                    fallbackCopy(postId, button);
                });
            } else {
                fallbackCopy(postId, button);
            }
        }

        function fallbackCopy(text, button) {
            // 传统复制方法
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();

            try {
                document.execCommand('copy');
                showCopySuccess(button);
            } catch (err) {
                alert('复制失败，请手动复制: ' + text);
            }

            document.body.removeChild(textarea);
        }

        function showCopySuccess(button) {
            const originalText = button.innerHTML;
            button.innerHTML = '✓ 已复制';
            button.classList.add('copied');

            setTimeout(() => {
                button.innerHTML = originalText;
                button.classList.remove('copied');
            }, 2000);
        }

        function formatTimestamp(timestamp) {
            const date = new Date(timestamp);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');

            return `${year}-${month}-${day} ${hours}:${minutes}`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 回车键查询
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                loadFavorites();
            }
        });
    </script>
</body>
</html>
